<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مذكرات">
<title>مذكرات</title>
<style>
:root{
  --bg:#0d1326;--card:#151d37;--card2:#1c2748;--field:#0b1022;--line:#ffffff14;
  --gold:#e8c170;--text:#eef1f8;--muted:#98a3c2;--danger:#e0656f;--ok:#5cc8a1;
  --r:18px;--gap:14px;--pad:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,button,input,textarea,audio{touch-action:manipulation}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Geeza Pro",sans-serif;background:radial-gradient(circle at 15% 0%,#22306060 0%,transparent 50%),radial-gradient(circle at 90% 8%,#e8c17012 0%,transparent 40%),var(--bg);background-attachment:fixed;color:var(--text);min-height:100vh;overscroll-behavior:none;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
svg{display:block}

/* ===== الهيكل ===== */
.app{width:100%;max-width:560px;margin:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--gap)}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 2px 12px;background:linear-gradient(var(--bg) 78%,transparent)}
.top h1{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.top .btns{display:flex;gap:8px}
.icon{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);transition:transform .15s}
.icon:active{transform:scale(.92)}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:0 10px 26px #0005}

/* ===== اليوم والقمر ===== */
.today{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px}
.dates{display:flex;flex-direction:column;gap:6px;min-width:0}
.wd{color:var(--gold);font-size:15px;font-weight:600}
.g{font-size:22px;font-weight:800}
.h{color:var(--muted);font-size:16px}
.divider{height:1px;background:var(--line);margin:4px 0}
.moonbox{display:flex;flex-direction:column;align-items:center;gap:6px;width:128px}
.moonbox canvas{border-radius:50%}
.mname{font-weight:800;color:var(--gold);font-size:15px}
.minfo{font-size:12px;color:var(--muted);text-align:center;line-height:1.7}

/* ===== التقويم ===== */
.calhead{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;text-align:center;margin-bottom:14px}
#calTitle{font-weight:800;font-size:18px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week{margin-bottom:6px}
.week div{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.grid{grid-auto-rows:48px}
.day{border-radius:12px;background:#ffffff08;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:background .15s}
.day b{font-size:15px;line-height:1.2}
.day small{font-size:10px;color:var(--muted);line-height:1.2}
.day.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.day.sel{background:var(--gold);color:#1a1a1a}
.day.sel small{color:#3d3a30}
.day.has::after{content:"";position:absolute;top:5px;inset-inline-start:5px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day.sel.has::after{background:#1f7a55}
.day.fri b{color:#f0a37a}
.day.sel.fri b{color:#1a1a1a}
.calfoot{display:flex;justify-content:center;margin-top:12px}
.link{color:var(--gold);font-size:14px;font-weight:600;padding:6px 14px;border-radius:20px;background:#e8c17012}

/* ===== المحرر ===== */
.edhead{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
#edTitle{font-size:17px;font-weight:800}
textarea{display:block;width:100%;height:44vh;min-height:280px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text);padding:16px;font:inherit;font-size:17px;resize:none;line-height:1.9}
textarea:focus{outline:none;border-color:#e8c17088}
textarea::placeholder{color:#56618a}
#draft{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#draft:empty{display:none}
.actions{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;margin-top:16px}
.round{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 6px 16px #0006}
.round:active{transform:scale(.9)}
.round.mic{background:#ffffff0c;color:var(--gold);border:2px solid var(--gold)}
.round.mic.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite}
.round.save{background:var(--gold);color:#1a1a1a}
.round:disabled{opacity:.5}
#recTime{font-size:18px;color:var(--danger);font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
@keyframes pulse{50%{box-shadow:0 0 0 10px #e0656f33}}
.aud{display:flex;align-items:center;gap:8px;background:#ffffff0a;border:1px solid var(--line);border-radius:30px;padding:4px 6px 4px 10px}
.aud audio{flex:1;height:38px;min-width:0}
.aud .x{color:var(--danger);width:32px;height:32px;display:flex;align-items:center;justify-content:center}

/* ===== القائمة ===== */
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tab{flex:1;padding:10px 8px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:600;transition:.2s}
.tab.active{background:var(--gold);color:#1a1a1a}
#list{display:flex;flex-direction:column;gap:var(--gap)}
.note{display:flex;flex-direction:column;gap:10px}
.note .nh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.note p{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere;font-size:16px}
.del{color:var(--danger);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#e0656f14}
.empty{text-align:center;color:var(--muted);padding:28px 0}

/* ===== شاشة القفل ===== */
.lock{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#2a3a78 0%,#141c3a 45%,#070a16 100%);display:flex;z-index:50;padding:24px;overflow-x:hidden;overflow-y:auto}
#stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.lockbox{position:relative;margin:auto;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;animation:rise .6s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.lockbox canvas{border-radius:50%;margin-bottom:26px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.lockbox h1{font-size:42px;font-weight:800;line-height:1.2;background:linear-gradient(180deg,#f7e2ad,#d9a94e);-webkit-background-clip:text;background-clip:text;color:transparent}
.ldate{color:#b9c2de;font-size:14px;margin-top:6px;opacity:.85;text-align:center}
#lockMsg{color:var(--muted);font-size:14px;min-height:22px;margin:16px 0 10px;text-align:center}
#lockMsg.err{color:var(--danger)}
.pinrow{display:flex;gap:8px;width:100%;height:66px;padding:7px;border-radius:20px;background:#ffffff0d;border:1px solid #ffffff1f;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 32px #0007,inset 0 1px 0 #ffffff14;transition:box-shadow .3s,border-color .3s}
.pinrow:focus-within{border-color:#e8c17080;box-shadow:0 14px 32px #0007,0 0 0 4px #e8c1701c}
.pinrow:has(.bad){border-color:var(--danger)}
#pinInput{flex:1;min-width:0;height:100%;border:none;border-radius:14px;background:transparent;color:var(--gold);font-size:30px;text-align:center;letter-spacing:18px;padding-left:18px;font-family:inherit;direction:ltr}
#pinInput:focus{outline:none}
#pinInput::placeholder{color:#ffffff30;letter-spacing:14px}
#pinInput.bad{animation:shake .4s}
.lockbtn{width:52px;height:100%;border-radius:14px;background:linear-gradient(145deg,#f3d58f,#d4a24a);color:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px #d4a24a55;transition:transform .15s}
.lockbtn:active{transform:scale(.92)}
#lockCancel{margin-top:18px}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* ===== نافذة التأكيد ===== */
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:70;padding:24px}
.mbox{width:100%;max-width:320px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center;box-shadow:0 20px 40px #0008}
.mbox p{font-size:16px;margin-bottom:20px}
.mbtns{display:flex;gap:10px}
.mbtn{flex:1;padding:12px;border-radius:12px;background:#ffffff10;font-weight:700}
.mbtn.danger{background:var(--danger);color:#fff}

#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(140px);background:#000d;padding:12px 20px;border-radius:14px;transition:.3s;z-index:80;max-width:90%;text-align:center;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="lock" class="lock">
  <div id="stars"></div>
  <div class="lockbox">
    <canvas id="lockMoon"></canvas>
    <h1>مذكرات</h1>
    <div class="ldate" id="lockDate"></div>
    <p id="lockMsg"></p>
    <div class="pinrow" id="pinRow">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="new-password" enterkeyhint="done" aria-label="الرقم السري">
      <button type="button" class="lockbtn" id="lockBtn" aria-label="فتح"></button>
    </div>
    <button id="lockCancel" type="button" class="link hidden">إلغاء</button>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <h1>مذكرات</h1>
    <div class="btns">
      <button class="icon" id="btnPin" aria-label="تغيير الرقم السري">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M18 5l2 2"/></svg>
      </button>
      <button class="icon" id="btnLock" aria-label="قفل">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
    </div>
  </header>

  <section class="card today">
    <div class="dates">
      <div class="wd" id="tWeek"></div>
      <div class="g" id="tGreg"></div>
      <div class="divider"></div>
      <div class="h" id="tHijri"></div>
    </div>
    <div class="moonbox">
      <canvas id="moonCv"></canvas>
      <div class="mname" id="mName"></div>
      <div class="minfo" id="mInfo"></div>
    </div>
  </section>

  <section class="card">
    <div class="calhead">
      <button class="icon" id="prev" aria-label="الشهر السابق">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <div><div id="calTitle"></div><div class="sub" id="calHijri"></div></div>
      <button class="icon" id="next" aria-label="الشهر التالي">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="week"><div>سبت</div><div>أحد</div><div>إثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div></div>
    <div class="grid" id="grid"></div>
    <div class="calfoot"><button class="link" id="goToday">العودة إلى اليوم</button></div>
  </section>

  <section class="card">
    <div class="edhead">
      <div id="edTitle"></div>
      <div class="sub" id="edSub"></div>
    </div>
    <textarea id="txt" placeholder="في هذا اليوم..."></textarea>
    <div id="draft"></div>
    <div class="actions">
      <button id="btnRec" class="round mic" aria-label="تسجيل صوتي"></button>
      <span id="recTime"></span>
      <button id="btnSave" class="round save" aria-label="حفظ">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-f="day">مذكرات اليوم المحدد</button>
    <button class="tab" data-f="all">كل المذكرات</button>
  </div>
  <div id="list"></div>
</div>

<div id="modal" class="modal hidden">
  <div class="mbox">
    <p id="mText"></p>
    <div class="mbtns"><button id="mNo" class="mbtn">إلغاء</button><button id="mYes" class="mbtn danger">حذف</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const pad2 = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIC_ICON = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
const STOP_ICON = '<svg viewBox="0 0 24 24" width="26" height="26"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
const LOCK_ICON = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg>';
const UNLOCK_ICON = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.8"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg>';
const DEL_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
const X_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }

// نافذة تأكيد خاصة بالتطبيق (بديل confirm الذي قد يُحجب في بعض المتصفحات)
let modalDone = null;
function askConfirm(text) {
  return new Promise(res => {
    $('#mText').textContent = text; $('#modal').classList.remove('hidden');
    modalDone = v => { $('#modal').classList.add('hidden'); modalDone = null; res(v); };
  });
}
$('#mYes').onclick = () => modalDone && modalDone(true);
$('#mNo').onclick = () => modalDone && modalDone(false);
$('#modal').onclick = e => { if (e.target.id === 'modal' && modalDone) modalDone(false); };

/* ============ التخزين الدائم ============ */
let backend = 'mem', db = null; const mem = { notes: [], meta: {} };
const hasWS = () => { try { return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); } catch (e) { return false; } };
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('mudhakkirati', 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('notes')) d.createObjectStore('notes', { keyPath: 'id' }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res(); r.onblocked = () => res();
    } catch (e) { res(); }
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    let t; try { t = db.transaction(store, mode); } catch (e) { rej(e); return; }
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const Store = {
  async init() {
    if (hasWS()) { backend = 'ws'; return; }
    await openDB();
    if (db) {
      backend = 'idb';
      try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) {}
    }
  },
  async getMeta(k) {
    let v;
    try {
      if (backend === 'ws') { const r = await window.storage.get('meta:' + k, false); v = r ? r.value : undefined; }
      else if (backend === 'idb') v = await tx('meta', 'readonly', s => s.get(k));
    } catch (e) {}
    if (v === undefined || v === null) { try { v = localStorage.getItem('mudhakkirati:' + k); } catch (e) {} }
    if (v === undefined || v === null) v = mem.meta[k];
    return v == null ? undefined : v;
  },
  async setMeta(k, v) {
    mem.meta[k] = v;
    let ok = false;
    try {
      if (backend === 'ws') { for (let i = 0; i < 2 && !ok; i++) ok = !!(await window.storage.set('meta:' + k, v, false)); }
      else if (backend === 'idb') { await tx('meta', 'readwrite', s => s.put(v, k)); ok = true; }
    } catch (e) {}
    if (!ok) { try { localStorage.setItem('mudhakkirati:' + k, v); ok = true; } catch (e) {} }
    return ok;
  },
  async loadNotes() {
    try {
      if (backend === 'ws') {
        const l = await window.storage.list('note:', false); const keys = (l && l.keys) || [], out = [];
        for (const k of keys) { const key = typeof k === 'string' ? k : k.key; try { const r = await window.storage.get(key, false); if (r) out.push(JSON.parse(r.value)); } catch (e) {} }
        return out;
      }
      if (backend === 'idb') return (await tx('notes', 'readonly', s => s.getAll())) || [];
    } catch (e) { return []; }
    return mem.notes.slice();
  },
  async putNote(n) {
    if (backend === 'ws') {
      const audios = await Promise.all((n.audios || []).map(async a => ({ data: a.data || await blobToData(a.blob) })));
      const r = await window.storage.set('note:' + n.id, JSON.stringify({ ...n, audios }), false);
      if (!r) throw new Error('save'); n.audios = audios; return;
    }
    if (backend === 'idb') return tx('notes', 'readwrite', s => s.put(n));
    mem.notes.push(n);
  },
  async delNote(id) {
    if (backend === 'ws') { await window.storage.delete('note:' + id, false); return; }
    if (backend === 'idb') return tx('notes', 'readwrite', s => s.delete(id));
    mem.notes = mem.notes.filter(n => n.id !== id);
  }
};

/* ============ التواريخ ============ */
function hijriFmt(loc, opts) {
  for (const cal of ['islamic-umalqura', 'islamic-civil', 'islamic']) {
    try { const f = new Intl.DateTimeFormat(`${loc}-u-ca-${cal}-nu-latn`, opts); if (f.resolvedOptions().calendar.startsWith('islamic')) return f; } catch (e) {}
  }
  return { format: () => '' };
}
const gWeek = new Intl.DateTimeFormat('ar-u-nu-latn', { weekday: 'long' });

  if (!text && !draftAudios.length) { toast('اكتب شيئاً أو سجّل مقطعاً صوتياً'); return; }
  saving = true; $('#btnSave').disabled = true;
  const n = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), date: sel, text, audios: draftAudios.slice(), created: Date.now() };
  try {
    await Store.putNote(n);
    notes.push(n); draftAudios = []; $('#txt').value = '';
    renderDraft(); renderCal(); renderList(); toast('تم الحفظ ✅');
  } catch (e) { toast('تعذر الحفظ، قد يكون التسجيل طويلاً جداً'); }
  saving = false; $('#btnSave').disabled = false;
}

/* ============ الأحداث ============ */
$('#btnRec').innerHTML = MIC_ICON;
$('#grid').onclick = e => { const b = e.target.closest('[data-k]'); if (b) select(b.dataset.k); };
$('#prev').onclick = () => { vm--; if (vm < 0) { vm = 11; vy--; } renderCal(); };
$('#next').onclick = () => { vm++; if (vm > 11) { vm = 0; vy++; } renderCal(); };
$('#goToday').onclick = () => select(keyOf(new Date()));
$('#btnRec').onclick = toggleRec;
$('#btnSave').onclick = saveNote;
$('#draft').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { draftAudios.splice(+b.dataset.rm, 1); renderDraft(); } };
$('#list').onclick = async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const id = b.dataset.del;
  if (!(await askConfirm('هل تريد حذف هذه المذكرة نهائياً؟'))) return;
  try { await Store.delNote(id); } catch (err) { toast('تعذر الحذف'); return; }
  notes = notes.filter(n => n.id !== id); renderCal(); renderList(); toast('تم الحذف');
};
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
  filter = t.dataset.f; renderList();
});
$('#btnLock').onclick = () => { stopRec(); if (pinSet) showLock('enter'); };
$('#btnPin').onclick = () => { stopRec(); showLock(pinSet ? 'old' : 'set1'); };
$('#lockCancel').onclick = () => { if (lockMode === 'old' || lockMode === 'set1' || lockMode === 'set2') unlock(); };

// منع التكبير بالإصبعين (iOS)
document.addEventListener('gesturestart', e => e.preventDefault());

// قفل تلقائي عند الخروج — ويُلغى أي تغيير للرقم السري لم يكتمل
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopRec();
    if (pinSet && (unlocked || lockMode !== 'enter')) showLock('enter');
  } else if (unlocked) { renderToday(); renderCal(); }
});

// تحديث التاريخ والقمر تلقائياً عند منتصف الليل
setInterval(() => {
  const k = keyOf(new Date());
  if (k !== todayKey) { todayKey = k; if (unlocked) { renderToday(); renderCal(); } }
}, 60000);

/* ============ تثبيت كتطبيق على الهاتف والعمل بدون إنترنت ============ */
if (/^https?:$/.test(location.protocol) && !hasWS()) {
  [['manifest', 'manifest.json'], ['icon', 'icon.svg'], ['apple-touch-icon', 'icon.svg']].forEach(([rel, href]) => {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ============ البدء ============ */
(async () => {
  try {
    await Store.init();
    notes = await Store.loadNotes();
    pinSet = !!(await Store.getMeta('pin'));
  } catch (e) {}
  showLock(pinSet ? 'enter' : 'set1');
})();
</script>
</body>
</html>
